# Tests every push and pull request; on main, also builds the frontend for
# the four-container deployment and publishes it to the `frontend-dist`
# branch, which the gateway machine pulls (docs/DEPLOYMENT.md). The lab
# machines have no Node toolchain, so the build happens here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # publish-frontend pushes the frontend-dist branch

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  publish-frontend:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Build for the gateway
        working-directory: frontend
        env:
          # Empty: the gateway serves this bundle and the API from one
          # origin, so API calls are relative and need no CORS.
          VITE_API_BASE_URL: ""
          # No database in this deployment; a click analyzes a square area.
          VITE_CLICK_ANALYZES_AREA: "true"
        run: npx vite build --outDir ../frontend-dist --emptyOutDir
      - name: Publish to the frontend-dist branch
        working-directory: frontend-dist
        run: |
          git init -q -b frontend-dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Frontend build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" frontend-dist
