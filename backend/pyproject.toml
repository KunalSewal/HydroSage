[project]
name = "hydrosage-backend"
version = "0.1.0"
description = "HydroSage API — terrain, catchment, and rainfall analysis for pond siting"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.1",
    "minio>=7.2",
    "httpx>=0.27",
    "rasterio>=1.3",
    "shapely>=2.0",
    "numpy>=2.0",
    "scikit-image>=0.24",
    "pysheds>=0.4",
    "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: hits a live external API, skipped by default"]
